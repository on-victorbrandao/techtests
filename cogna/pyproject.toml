[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cogna-etl"
version = "0.1.0"
description = "Pipeline de ETL e analytics para teste tecnico Cogna Educacao"
authors = [{ name = "Victor Amorim" }]
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0.0",
    "pyarrow>=26.0.0",
    "duckdb>=2.0.0",
    "openpyxl>=3.1.5",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# consultas SQL em texto nos testes da silver e gold passam de 88 colunas
"tests/test_fase3.py" = ["E501"]
"tests/test_fase4.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
markers = ["integration: marks integration tests"]

